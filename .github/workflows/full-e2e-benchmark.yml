name: Full End-to-End Load Test/Benchmark

on:
  push:
    branches: [ "main" ]

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install iperf3 and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y iperf3
          sudo apt-get install -y bats

      - name: Run BATS test(s)
        run: bats tests/full_e2e_benchmark.bats

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            server.log
            client.log
            iperf_server.log

