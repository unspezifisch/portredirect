name: Full End-to-End Benchmark (custom python script)
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false
jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Install Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Install Pip dependencies
        run: pip install -r tests/requirements.txt
      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          limit-access-to-actor: true
      - name: Run Python Unit Tests
        run: make test_python
      - name: Run Big Benchmark
        run: bats --gather-test-outputs-in ./bats-logs tests/full_e2e_connection_stress_test.bats
      - name: Run Data Cruncher for Plots
        run: python3 tests/cst_datacruncher.py -o testplots testlogs/prrs_*/cst_*
      - name: Show Log and Plot Files
        if: always()
        run: |
          echo "========== testlogs =========="
          tail -n+0 ./testlogs/*/* || true
          echo "========== bats-logs =========="
          tail -n+0 ./bats-logs/* || true
          echo "========== testplots =========="
          ls -l testplots || true
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portredirect-e2e-benchmark-artifacts
          path: |
            ./testlogs
            ./bats-logs
            ./testplots
