name: Full End-to-End Test
# Similar to the benchmark workflow, but with a few checks removed.
# Also added a debug tmate hook.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install iperf3 and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y iperf3
          sudo apt-get install -y bats

      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          limit-access-to-actor: true

      - name: Run BATS test(s)
        run: bats tests/full_e2e_test.bats

      - name: Show Log Files
        if: always()
        run: |
          echo "========== server.log =========="
          cat server.log || true
          echo "========== client.log =========="
          cat client.log || true
          echo "========== iperf_server.log =========="
          cat iperf_server.log || true

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portredirect-e2e-test-logs
          path: |
            server.log
            client.log
            iperf_server.log

