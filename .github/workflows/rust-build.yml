name: Rust build
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (Debug)
        run: make build
      - name: Upload portredirect_server binary
        uses: actions/upload-artifact@v4
        with:
          name: portredirect_server
          path: target/debug/portredirect_server
      - name: Upload portredirect_client binary
        uses: actions/upload-artifact@v4
        with:
          name: portredirect_client
          path: target/debug/portredirect_client
