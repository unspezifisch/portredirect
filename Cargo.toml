[package]
name = "portredirect"
version = "0.1.0"
edition = "2021"
rust-version = "1.78.0"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.29", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.6"
getrandom = "0.3.1"
hex = "0.4.3"
quinn = "0.11.6"
rand = "0.9.0"
rcgen = { version = "0.13.2", features = ["pem", "crypto"] }
rustls = { version = "0.23.23", features = ["ring"] }
rustls-pemfile = "2.2.0"
secrecy = "0.10.3"
sha2 = "0.10.8"
tokio = { version = "1.43.0", features = ["full"] }
tokio-test = "0.4.4"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[dev-dependencies]
tempfile = "3.16.0"

[[bin]]
name = "portredirect_server"
path = "src/server/main.rs"

[[bin]]
name = "portredirect_client"
path = "src/client/main.rs"
