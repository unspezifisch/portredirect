[package]
name = "portredirect"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.94"
clap = { version = "4.5.23", features = ["derive"] }
dirs = "5.0.1"
env_logger = "0.11.5"
getrandom = "0.3.1"
hex = "0.4.3"
quinn = "0.11.6"
rand = "0.8.5"
rcgen = { version = "0.13.1", features = ["pem", "crypto"] }
rustls = { version = "0.23.20", features = ["ring"] }
rustls-pemfile = "2.2.0"
secrecy = "0.10.3"
sha2 = "0.10.8"
tokio = { version = "1.42.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[dev-dependencies]
tempfile = "3.14.0"

[[bin]]
name = "portredirect_server"
path = "src/server/main.rs"

[[bin]]
name = "portredirect_client"
path = "src/client/main.rs"
